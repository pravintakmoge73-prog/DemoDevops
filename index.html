<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1 {
            width: 200px;
            height: 40px;
            background-color: bisque;
            color: blue;
            margin: 20px auto; /* Centers the h1 element on the page */
            text-align: center; /* Centers the text inside the bisque box */
            line-height: 40px;  /* Vertically centers the text inside the 40px height */
        }
    </style>
</head>
<body>
    <h1>Hello !!</h1>
</body>
</html>
